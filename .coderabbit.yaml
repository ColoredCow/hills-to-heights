language: "en-US"

# ================================
# Reviews Configuration
# ================================
reviews:
  profile: "chill"                  # 'chill' = gentle feedback | 'assertive' = detailed feedback
  high_level_summary: true          # adds a summary to PRs
  auto_review:
    enabled: true                   # automatically review new PRs
    drafts: false                   # skip draft PRs for now

  path_filters:                     # restrict reviews to key WP folders
    - "wp-content/themes/**"
    - "wp-content/plugins/**"
    - "!node_modules/**"
    - "!vendor/**"

  path_instructions:                # context-specific review guidance
    - path: "wp-content/**"
      instructions: "Ensure code follows the performance best practices defined in /coding-guidelines/performance.md."

  # ================================
  # Tools (optional PHP checks)
  # ================================
  tools:
    phpcs:                          # PHP CodeSniffer (style & standards)
      enabled: true
    phpstan:                        # PHP static analysis
      enabled: true
    phpmd:                          # PHP Mess Detector
      enabled: true

# ================================
# Knowledge Base Configuration
# ================================
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "coding-guidelines/performance.md"

  learnings:
    scope: "local"                  # keep learnings project-specific (recommended)
